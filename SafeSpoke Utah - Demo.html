document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

4, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Public Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"0e9f2ec2-2245-4cf8-86fd-dd972d686930\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Public Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"195b5807-198a-4bae-a8fc-2693bf785aec\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Public Sans';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"54b9223b-77b7-456c-a929-ce5e767f340b\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Public Sans';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"0e9f2ec2-2245-4cf8-86fd-dd972d686930\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Public Sans';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"195b5807-198a-4bae-a8fc-2693bf785aec\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n<style>body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)}a{color:var(--color-accent-700)}a:hover{color:var(--color-accent-800)}*{box-sizing:border-box}<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"--font-heading:'Public Sans', system-ui, sans-serif;--font-body:'Public Sans', system-ui, sans-serif;--font-heading-weight:700;font-family:var(--font-body);--color-bg:#ffffff;--color-surface:#f2f3f0;--color-text:#1b2420;--color-divider:#d5d7d2;--color-accent:#0f5c50;--color-accent-100:#e3f0ec;--color-accent-200:#c4e0d8;--color-accent-300:#9ccabe;--color-accent-400:#3a9a8a;--color-accent-500:#0f5c50;--color-accent-600:#0c4f45;--color-accent-700:#0a463d;--color-accent-800:#083a33;--color-accent-900:#062b26;--color-accent-2-100:#e8f1ec;--color-accent-2-200:#d6e6cf;--color-accent-2-400:#3a9a8a;--color-accent-2-600:#2f8676;--color-accent-2-700:#0f5c50;--color-accent-2-800:#0d4d43;--color-accent-2-900:#083a33;--color-neutral-100:#e9eae5;--color-neutral-200:#e2e3de;--color-neutral-300:#cfd1cb;--color-neutral-400:#9a96a0;--color-neutral-700:#5b625e;--color-neutral-800:#3a403c;background:#eef0ec;color:var(--color-text);min-height:100vh;padding:{{ rootPad }};display:flex;flex-direction:column;gap:28px;min-width:{{ rootMinW }};align-items:{{ rootAlign }};justify-content:center\">\n  <sc-if value=\"{{ showTitle }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:6px\">\n    <h1 style=\"margin:0;font-family:var(--font-heading);font-weight:700;letter-spacing:-0.01em;font-size:36px;font-weight:400\">SafeSpoke Utah<\u002Fh1>\n    <p style=\"margin:0;font-size:15px;color:var(--color-neutral-700)\">Clickable prototype. Desktop and phone share the same trip — try “Send to phone”.<\u002Fp>\n  <\u002Fdiv><\u002Fsc-if>\n  <div style=\"display:flex;gap:40px;align-items:flex-start\">\n\n    <sc-if value=\"{{ showDesktop }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:10px;zoom:{{ dZoom }}\">\n      <sc-if value=\"{{ showLabels }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"tag tag-neutral\" style=\"align-self:flex-start\">Desktop · {{ dLabel }}<\u002Fspan><\u002Fsc-if>\n      <div data-screen-label=\"Desktop\" style=\"width:1280px;height:820px;background:var(--color-bg);border-radius:28px;box-shadow:var(--shadow-lg);overflow:hidden;display:flex;flex-direction:column;outline:1px solid var(--color-neutral-200);position:relative\">\n        <nav class=\"nav\" style=\"padding:14px 24px;gap:14px;align-items:flex-end\">\n          <a href=\"#\" sc-camel-on-click=\"{{ goPlan }}\" class=\"nav-brand\" style=\"display:flex;align-items:center;gap:10px;margin-right:12px;align-self:center;font-size:18px\"><span style=\"width:30px;height:30px;border-radius:50%;background:var(--color-accent);display:grid;place-items:center\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"6\" cy=\"17\" r=\"3.5\"><\u002Fcircle><circle cx=\"18\" cy=\"17\" r=\"3.5\"><\u002Fcircle><path d=\"M6 17l4-8h6l2 8M10 9 8.5 6H7M14 6h2.5\"><\u002Fpath><\u002Fsvg><\u002Fspan>SafeSpoke Utah<\u002Fa>\n          <div class=\"field\" style=\"flex:1;min-width:0\"><label>From<\u002Flabel><input class=\"input\" value=\"{{ from }}\" sc-camel-on-change=\"{{ setFromText }}\" placeholder=\"Current location\"><\u002Fdiv>\n          <button class=\"btn btn-secondary btn-icon\" sc-camel-on-click=\"{{ swap }}\" aria-label=\"Swap from and to\" style=\"flex:none\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m16 3 4 4-4 4M20 7H4M8 21l-4-4 4-4M4 17h16\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n          <div class=\"field\" style=\"flex:1;min-width:0\"><label>To<\u002Flabel><input class=\"input\" value=\"{{ to }}\" sc-camel-on-change=\"{{ setToText }}\" placeholder=\"Search an address or place\" style=\"border-color:{{ toBorder }}\"><\u002Fdiv>\n          <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ find }}\" style=\"flex:none;min-height:36px\">Find calm routes<\u002Fbutton>\n          <div style=\"display:flex;gap:18px;margin-left:10px;align-self:center\">\n            <a href=\"#\" sc-camel-on-click=\"{{ goMap }}\" aria-current=\"{{ navMapCur }}\">Map<\u002Fa>\n            <a href=\"#\" sc-camel-on-click=\"{{ goAbout }}\" aria-current=\"{{ navAboutCur }}\">About the data<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fnav>\n\n        <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"flex:1;min-height:0;overflow-y:auto;padding:24px 56px 56px 56px\">\n            <div style=\"max-width:720px;display:flex;flex-direction:column;gap:36px\">\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <span class=\"card-kicker\" style=\"color:var(--color-accent-700)\">About the data<\u002Fspan>\n                <h2 style=\"margin:0;font-family:var(--font-heading);font-weight:700;letter-spacing:-0.01em;font-size:40px;line-height:1.1\">Where the map comes from, and what it can’t tell you<\u002Fh2>\n                <p style=\"margin:0;font-size:16px;line-height:1.55;color:var(--color-neutral-800);text-wrap:pretty\">SafeSpoke combines two public datasets: planned bikeways from the Utah Geospatial Resource Center (UGRC) and bike-involved crash records from the Utah Department of Transportation (UDOT). Updated Oct 9, 2026.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n                <div class=\"card\" style=\"gap:8px\"><span class=\"card-kicker\" style=\"color:var(--color-accent-700)\">UGRC<\u002Fspan><span class=\"card-title\" style=\"font-size:20px\">Planned bikeways<\u002Fspan><p class=\"card-body\" style=\"font-size:14px;line-height:1.5\">Facilities on this layer are planned and may not be built yet. Each segment carries its facility type and which side of the street it runs on.<\u002Fp><\u002Fdiv>\n                <div class=\"card\" style=\"gap:8px\"><span class=\"card-kicker\" style=\"color:var(--color-accent-700)\">UDOT<\u002Fspan><span class=\"card-title\" style=\"font-size:20px\">Bike-involved crashes<\u002Fspan><p class=\"card-body\" style=\"font-size:14px;line-height:1.5\">Reported crashes from 2018 to present, refreshed nightly. Recent locations can be corrected later. A crash counts toward a segment if it’s within 50 ft.<\u002Fp><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:14px\">\n                <h3 style=\"margin:0;font-family:var(--font-heading);font-weight:700;letter-spacing:-0.01em;font-size:24px\">How we rate traffic stress<\u002Fh3>\n                <sc-for list=\"{{ ltsLegend }}\" as=\"l\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;align-items:center;gap:16px\"><span style=\"width:44px;height:8px;border-radius:999px;background:{{ l.color }};flex:none\"><\u002Fspan><span style=\"width:90px;font-weight:700;font-size:15px;flex:none\">{{ l.label }}<\u002Fspan><span style=\"font-size:15px;color:var(--color-neutral-800)\">{{ l.long }}<\u002Fspan><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <h3 style=\"margin:0;font-family:var(--font-heading);font-weight:700;letter-spacing:-0.01em;font-size:24px\">How routes are ranked<\u002Fh3>\n                <p style=\"margin:0;font-size:15px;line-height:1.55;color:var(--color-neutral-800)\"><strong>Calmest<\u002Fstrong> maximizes time on very-low and low-stress streets, even if it adds blocks. <strong>Balanced<\u002Fstrong> allows one busier crossing to save time. <strong>Most direct<\u002Fstrong> is the shortest path regardless of stress, shown so you can compare.<\u002Fp>\n              <\u002Fdiv>\n              <p style=\"margin:0;padding:16px 20px;border-radius:22px;background:#fbecd0;color:#7a4a10;font-size:14px;line-height:1.5\">Data is a guide, not a guarantee. Always check conditions on the ground before you ride.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ notAbout }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"flex:1;min-height:0;display:flex;gap:16px;padding:0 16px 16px 16px\">\n            <aside style=\"width:360px;flex:none;overflow-y:auto;padding:8px 12px 24px 12px;display:flex;flex-direction:column;gap:26px\">\n\n              <sc-if value=\"{{ isPlan }}\" hint-placeholder-val=\"{{ true }}\">\n                <sc-if value=\"{{ noSearch }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:22px;border-radius:24px;background:var(--color-surface);display:flex;flex-direction:column;gap:8px\">\n                    <span class=\"card-title\" style=\"font-size:20px\">Where are you headed?<\u002Fspan>\n                    <p style=\"margin:0;font-size:14px;line-height:1.5;color:var(--color-neutral-800)\">Enter a destination above and we’ll find routes that keep you on calm streets.<\u002Fp>\n                    <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:6px\"><sc-for list=\"{{ places }}\" as=\"p\"><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ p.pickDesk }}\" style=\"font-size:13px;min-height:32px;background:var(--color-bg)\">{{ p.name }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ searched }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"display:flex;flex-direction:column;gap:10px\">\n                    <div class=\"card-kicker\" style=\"color:var(--color-accent-700)\">Route options<\u002Fdiv>\n                    <sc-for list=\"{{ routes }}\" as=\"r\" hint-placeholder-count=\"3\">\n                      <div sc-camel-on-click=\"{{ r.pick }}\" style=\"cursor:pointer;padding:14px 16px;border-radius:22px;background:{{ r.bg }};border:2px solid {{ r.border }};display:flex;flex-direction:column;gap:6px\">\n                        <div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"font-family:var(--font-heading);font-weight:700;letter-spacing:-0.01em;font-size:18px\">{{ r.name }}<\u002Fspan><span style=\"margin-left:auto;font-size:13px;color:var(--color-neutral-700)\">{{ r.mi }} mi · {{ r.min }} min<\u002Fspan><\u002Fdiv>\n                        <p style=\"margin:0;font-size:13px;line-height:1.4;color:var(--color-neutral-800)\">{{ r.desc }}<\u002Fp>\n                        <div style=\"display:flex;gap:6px;flex-wrap:wrap\"><span class=\"tag tag-accent-2\">{{ r.pctLabel }}<\u002Fspan><span class=\"tag tag-accent\">{{ r.crashNear }}<\u002Fspan><\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                    <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ sendToPhone }}\" style=\"min-height:44px;margin-top:4px\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"2\" width=\"12\" height=\"20\" rx=\"3\"><\u002Frect><path d=\"M11 18h2\"><\u002Fpath><\u002Fsvg>Send {{ routeLower }} route to phone<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"display:flex;flex-direction:column;gap:12px\">\n                  <div class=\"card-kicker\" style=\"color:var(--color-accent-700)\">Map layers<\u002Fdiv>\n                  <div sc-camel-on-click=\"{{ toggleBikeways }}\" style=\"display:flex;align-items:center;gap:12px;cursor:pointer\">\n                    <div style=\"flex:1\"><div style=\"font-size:14px;font-weight:600\">Planned bikeways<\u002Fdiv><div style=\"font-size:12px;color:var(--color-neutral-700)\">UGRC · colored by traffic stress<\u002Fdiv><\u002Fdiv>\n                    <span style=\"width:40px;height:24px;border-radius:999px;background:{{ bikewaysTrack }};position:relative;flex:none\"><span style=\"position:absolute;top:3px;left:{{ bikewaysKnob }};width:18px;height:18px;border-radius:50%;background:#ffffff;box-shadow:var(--shadow-sm)\"><\u002Fspan><\u002Fspan>\n                  <\u002Fdiv>\n                  <div sc-camel-on-click=\"{{ toggleCrashes }}\" style=\"display:flex;align-items:center;gap:12px;cursor:pointer\">\n                    <div style=\"flex:1\"><div style=\"font-size:14px;font-weight:600\">Bike-involved crashes<\u002Fdiv><div style=\"font-size:12px;color:var(--color-neutral-700)\">UDOT · 2018 to present<\u002Fdiv><\u002Fdiv>\n                    <span style=\"width:40px;height:24px;border-radius:999px;background:{{ crashesTrack }};position:relative;flex:none\"><span style=\"position:absolute;top:3px;left:{{ crashesKnob }};width:18px;height:18px;border-radius:50%;background:#ffffff;box-shadow:var(--shadow-sm)\"><\u002Fspan><\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"padding:16px 18px;border-radius:22px;background:var(--color-accent-2-100);display:flex;flex-direction:column;gap:6px\">\n                  <div style=\"font-family:var(--font-heading);font-weight:700;letter-spacing:-0.01em;font-size:16px;color:var(--color-accent-2-900)\">About the data<\u002Fdiv>\n                  <p style=\"margin:0;font-size:13px;line-height:1.45;color:var(--color-accent-2-900)\">Bikeways are planned facilities from UGRC and may not be built yet. Crashes come from UDOT, refreshed nightly.<\u002Fp>\n                  <a href=\"#\" sc-camel-on-click=\"{{ goAbout }}\" style=\"font-size:13px;font-weight:600;text-decoration:none\">How we rate stress →<\u002Fa>\n
